# Frontend · Rol 4 (ver CONTRATO.md, secciones 2 y 5)
# El frontend llama a los microservicios por el nombre DNS de sus Services, nunca por IP.

apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: virtual4insanity
data:
  MIEMBROS_URL: "http://api-miembros:5000"
  CLASES_URL: "http://api-clases:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: virtual4insanity
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/gimnasio-virtual4insanity/gimnasio/frontend:v1
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
# IP pública: GKE crea un balanceador de carga para este Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: virtual4insanity
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
