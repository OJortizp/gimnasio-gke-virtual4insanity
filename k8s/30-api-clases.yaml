apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-clases
  namespace: virtual4insanity
  labels:
    app: api-clases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-clases
  template:
    metadata:
      labels:
        app: api-clases
    spec:
      containers:
        - name: api-clases
          image: us-central1-docker.pkg.dev/gimnasio-virtual4insanity/gimnasio/api-clases:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          # Restricción obligatoria de recursos del contrato (nodos e2-small)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Inyección de variables no sensibles (ConfigMap) y sensibles (Secret)
          envFrom:
            - configMapRef:
                name: gimnasio-config
            - secretRef:
                name: gimnasio-secret
          # Verificación de salud del pod
          # Vivo si el proceso responde; no depende de la base, para no reiniciarlo si la base se cae
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/clases/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-clases
  namespace: virtual4insanity
  labels:
    app: api-clases
spec:
  type: ClusterIP
  selector:
    app: api-clases
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP