# Plantilla del Secret. Para usarla:
#   1. Copiarla como k8s/secret.yaml (ese archivo NO se sube, está en .gitignore)
#   2. Cambiar la contraseña
#   3. kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gimnasio-secret
  namespace: virtual4insanity
type: Opaque
stringData:
  DB_USER: gimnasio_user
  DB_PASSWORD: cambiar_esta_contrasena
