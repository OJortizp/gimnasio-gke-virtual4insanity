# Microservicio Clases · Rol 2 / Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-clases
  namespace: virtual4insanity
  labels:
    app: api-clases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-clases
  template:
    metadata:
      labels:
        app: api-clases
    spec:
      containers:
        - name: api-clases
          image: us-central1-docker.pkg.dev/gimnasio-virtual4insanity/gimnasio/api-clases:v1
          ports:
            - containerPort: 5001
          # DB_HOST, DB_PORT y DB_NAME salen del ConfigMap; DB_USER y DB_PASSWORD del Secret
          envFrom:
            - configMapRef:
                name: gimnasio-config
            - secretRef:
                name: gimnasio-secret
          # Readiness probe para verificar salud incluyendo la base de datos
          readinessProbe:
            httpGet:
              path: /api/clases/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness probe para asegurar que el proceso sigue vivo
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-clases
  namespace: virtual4insanity
  labels:
    app: api-clases
spec:
  type: ClusterIP
  selector:
    app: api-clases
  ports:
    - port: 5001
      targetPort: 5001